name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Raise memlock limit for memguard
        run: sudo prlimit --pid $PPID --memlock=unlimited:unlimited

      - name: Cache benchmark corpora
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: testdata/corpus/.cache
          key: sriracha-corpus-7d1ae7084e1329c25a74e2372ffdc2c15873869157e05e1532d718d029261611-8ec089d67f4412c706cfa1bf7885c5ded9a8a389707bbed09743e0bab9f51c22

      - uses: bencherdev/bencher@5f9d4cf890255c35e0354af1ed325108a6a0babd # v0.6.8

      - name: Track benchmarks (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: go test -bench=. -benchmem ./... | tee results.txt

      - name: Run quality benchmark (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SRIRACHA_BENCH_OUT: ${{ github.workspace }}/quality.json
        run: go test -tags=bench -count=1 -timeout 10m ./test/bench/...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: bench-results-main
          path: |
            results.txt
            quality.json

      - name: Run benchmarks (PR)
        if: github.event_name == 'pull_request'
        run: go test -bench=. -benchmem ./... | tee results.txt

      - name: Run quality benchmark (PR)
        if: github.event_name == 'pull_request'
        env:
          SRIRACHA_BENCH_OUT: ${{ github.workspace }}/quality.json
        run: go test -tags=bench -count=1 -timeout 10m ./test/bench/...

      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s\n' "$PR_NUMBER" > pr-number.txt
          printf '%s\n' "$HEAD_REF" > head-ref.txt
          printf '%s\n' "$BASE_REF" > base-ref.txt
          printf '%s\n' "$BASE_SHA" > base-sha.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: bench-results
          path: |
            results.txt
            quality.json
            pr-number.txt
            head-ref.txt
            base-ref.txt
            base-sha.txt