version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - copyloopvar
    - errorlint
    - forcetypeassert
    - gosec
    - depguard
  settings:
    gosec:
      excludes:
        - G304
    depguard:
      rules:
        no-unsafe:
          deny:
            - pkg: unsafe
              desc: the unsafe package is forbidden in this repository

formatters:
  enable:
    - gofmt
    - goimports
